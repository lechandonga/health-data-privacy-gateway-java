server.port=8080

# 稳定假名与审计哈希链的 HMAC 密钥（本地演示用，生产环境必须通过环境变量覆盖）
hdpg.hmac-key=${HDPG_HMAC_KEY:local-dev-hmac-key-change-me}
# 无同意时是否对直接标识符做确定性替换（false 时改为整体抹除）
hdpg.mask-direct-identifiers=true
# 直接标识符字段：任何授权状态下都不会以原值出现在输出中
hdpg.direct-identifier-fields[0]=name
hdpg.direct-identifier-fields[1]=idCard
hdpg.direct-identifier-fields[2]=phone
hdpg.direct-identifier-fields[3]=email
# 无同意时是否对准标识符做泛化（出生日期仅保留年份），false 时直接抹除
hdpg.generalize-without-consent=true
hdpg.quasi-identifier-fields[0]=birthDate
hdpg.quasi-identifier-fields[1]=address
# 是否对畸形/缺字段记录执行拒绝校验
hdpg.require-valid-record=true
# 是否启用访问审计
hdpg.audit-enabled=true
# 查询审计所需的授权用途
hdpg.audit-query-purpose=AUDIT_QUERY
